name: Lumina Launcher App Build

on:
  push:
    branches:
      - main
      - master
      - prod
      - release
      - beta
      - feature*
    tags:
      - release-*
      - beta-*
    paths:
      - .github/workflows/lumina-launcher-build.yml
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/app-lib/**'
      - 'packages/app-macros/**'
      - 'packages/assets/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.jsonc'
      - 'mise.toml'
      - 'rust-toolchain.toml'
  workflow_dispatch:

concurrency:
  group: lumina-launcher-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: 🐧 Linux x86_64 Build
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            artifact_name: lumina-launcher-bundle-linux-x86_64
          - runner: windows-latest
            label: 🪟 Windows x86_64 Build
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact_name: lumina-launcher-bundle-windows-x86_64
          - runner: windows-latest
            label: 🪟 Windows aarch64 Build
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            artifact_name: lumina-launcher-bundle-windows-aarch64
          - runner: macos-latest
            label: 🍎 macOS x86_64 Build
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            artifact_name: lumina-launcher-bundle-macos-x86_64
          - runner: macos-latest
            label: 🍎 macOS aarch64 Build
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            artifact_name: lumina-launcher-bundle-macos-aarch64

    env:
      CI: true
      # Override the automatic ephemeral Actions GITHUB_TOKEN (which dies when the
      # run ends) so vite.config.ts — which skips .env keys already present in
      # process.env — bakes the real long-lived PAT into the shipped app.
      GITHUB_TOKEN: ${{ secrets.LUMINA_UPDATE_TOKEN || '' }}

    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Validate Git config does not introduce CRLF
        shell: bash
        run: |
          echo "🔍 Checking Git config for CRLF settings..."

          autocrlf=$(git config --get core.autocrlf || echo "unset")
          eol_setting=$(git config --get core.eol || echo "unset")

          echo "core.autocrlf = $autocrlf"
          echo "core.eol = $eol_setting"

          if [ "$autocrlf" = "true" ]; then
            echo "⚠️ WARNING: core.autocrlf is set to 'true'. Consider setting it to 'input' or 'false'."
          fi

          if [ "$eol_setting" = "crlf" ]; then
            echo "⚠️ WARNING: core.eol is set to 'crlf'. Consider unsetting it or setting it to 'lf'."
          fi

      - name: 🔍 Check migration files line endings (LF only)
        shell: bash
        run: |
          echo "🔍 Scanning migration SQL files for CR characters (\\r)..."

          if grep -Iq $'\r' packages/app-lib/migrations/*.sql; then
            echo "❌ ERROR: Some migration files contain CR characters; expected LF-only files."
            exit 1
          fi

          echo "✅ All migration files use LF line endings."

      - name: 🧰 Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust_targets }}

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🧰 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🧰 Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: 🦀 Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          cache-on-failure: true

      - name: 💨 Setup Turbo cache
        uses: rharkor/caching-for-turbo@v1.8

      - name: 🐧 Install Linux build dependencies
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: ⚙️ Set application environment
        shell: bash
        run: |
          cp packages/app-lib/.env.prod packages/app-lib/.env
          # Inject the private-repo update token from the Actions secret so the
          # shipped frontend can authenticate update checks and installer downloads.
          # Create a fine-grained PAT (Contents: Read, scoped to zoxenzz/LuminaLauncher
          # only) and store it as the LUMINA_UPDATE_TOKEN repository secret.
          if [ -n "${{ secrets.LUMINA_UPDATE_TOKEN }}" ]; then
            echo "GITHUB_TOKEN=${{ secrets.LUMINA_UPDATE_TOKEN }}" >> packages/app-lib/.env
          fi

      # Release tags look like release-1.2.3 or beta-1.2.3. Bake the numeric part
      # into the build so the shipped version matches the tag (otherwise the app
      # would keep re-offering the same release after updating).
      #
      # The version is sanitized to major.minor.patch (no leading 'v', no
      # pre-release suffix) because the MSI bundler requires numeric-only
      # versions — the exact failure this repo hit with "1.1.0-beta".
      - name: 🏷️ Derive app version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#release-}"
          VERSION="${VERSION#beta-}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION%%-*}"
          echo "Derived app version: ${VERSION}"
          node scripts/derive-version.mjs "${VERSION}"

      - name: 📦 Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 🧹 Clean previous bundles
        shell: bash
        run: |
          rm -rf target/release/bundle
          rm -rf target/*/release/bundle || true

      - name: 🔨 Build app
        shell: bash
        run: mise exec -- pnpm --filter @modrinth/app exec tauri build --target ${{ matrix.target }}

      - name: 📤 Upload app bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

      # Publish installers to the GitHub Release so the in-app auto-updater
      # (helpers/lumina/update.ts) can find them via the releases API.
      # Find-or-create the release and upload via gh CLI — robust, idempotent,
      # and not dependent on a separate release-creation job.
      - name: 🚀 Publish bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        # The job-level GITHUB_TOKEN env is overridden with the read-only update
        # PAT (baked into the app for update checks); gh needs the auto-generated
        # write token (permissions: contents: write) to create/upload releases.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # gh api exits non-zero on 404 (release not created yet); without
          # `|| true` the failed substitution kills the step under set -e
          # before find-or-create can run.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq .id 2>/dev/null) || true
          if [ -z "$RELEASE_ID" ]; then
            # Concurrent matrix jobs may race to create it; ignore "already exists".
            # Use -f (type-inferred), NOT -F (raw string): -F sends booleans as
            # "true"/"false" strings, which the Releases API rejects with 422.
            gh api --method POST "repos/${{ github.repository }}/releases" \
              -f "tag_name=${{ github.ref_name }}" \
              -f "name=${{ github.ref_name }}" \
              -f generate_release_notes=true \
              -f draft=false \
              -f prerelease=false >/dev/null 2>&1 || true
          fi
          # Each platform only produces its own bundle types (Linux: deb/AppImage,
          # Windows: exe/msi, macOS: dmg). Unmatched globs would be passed to gh
          # as literal paths and fail the upload, so collect them with nullglob.
          shopt -s nullglob
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          FILES=("$BUNDLE_DIR"/nsis/*.exe "$BUNDLE_DIR"/msi/*.msi "$BUNDLE_DIR"/dmg/*.dmg "$BUNDLE_DIR"/deb/*.deb "$BUNDLE_DIR"/appimage/*.AppImage)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "⚠️ No installers found to upload — skipping."
            exit 0
          fi
          gh release upload "${{ github.ref_name }}" "${FILES[@]}" --clobber
