name: Lumina Launcher App Build

on:
  push:
    branches:
      - main
      - master
      - prod
      - release
      - beta
      - feature*
    tags:
      - release-*
      - beta-*
    paths:
      - .github/workflows/lumina-launcher-build.yml
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/app-lib/**'
      - 'packages/app-macros/**'
      - 'packages/assets/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.jsonc'
      - 'mise.toml'
      - 'rust-toolchain.toml'
  workflow_dispatch:

concurrency:
  group: lumina-launcher-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Creates the GitHub Release first (only when a tag is pushed) so all
  # matrix builds can publish their installers to it without racing.
  create-release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: 🏷️ Check if pushing a tag
        id: is_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "on_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_tag=false" >> "$GITHUB_OUTPUT"
          fi

      # Idempotent release creation via the GitHub CLI (pre-installed and
      # pre-authenticated on runners). Finds the release by tag if it already
      # exists, otherwise creates it — so re-running a tag never explodes.
      - name: 🚀 Create release (if not already present)
        id: create_release
        if: steps.is_tag.outputs.on_tag == 'true'
        shell: bash
        run: |
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq .id 2>/dev/null)
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(gh api --method POST "repos/${{ github.repository }}/releases" \
              -f "tag_name=${{ github.ref_name }}" \
              -f "name=${{ github.ref_name }}" \
              -F generate_release_notes=true \
              -F draft=false \
              -F prerelease=false \
              --jq .id)
          fi
          echo "id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: 🐧 Linux x86_64 Build
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            artifact_name: lumina-launcher-bundle-linux-x86_64
          - runner: windows-latest
            label: 🪟 Windows x86_64 Build
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact_name: lumina-launcher-bundle-windows-x86_64
          - runner: windows-latest
            label: 🪟 Windows aarch64 Build
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            artifact_name: lumina-launcher-bundle-windows-aarch64
          - runner: macos-latest
            label: 🍎 macOS x86_64 Build
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            artifact_name: lumina-launcher-bundle-macos-x86_64
          - runner: macos-latest
            label: 🍎 macOS aarch64 Build
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            artifact_name: lumina-launcher-bundle-macos-aarch64

    env:
      CI: true
      # Override the automatic ephemeral Actions GITHUB_TOKEN (which dies when the
      # run ends) so vite.config.ts — which skips .env keys already present in
      # process.env — bakes the real long-lived PAT into the shipped app.
      GITHUB_TOKEN: ${{ secrets.LUMINA_UPDATE_TOKEN || '' }}

    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Validate Git config does not introduce CRLF
        shell: bash
        run: |
          echo "🔍 Checking Git config for CRLF settings..."

          autocrlf=$(git config --get core.autocrlf || echo "unset")
          eol_setting=$(git config --get core.eol || echo "unset")

          echo "core.autocrlf = $autocrlf"
          echo "core.eol = $eol_setting"

          if [ "$autocrlf" = "true" ]; then
            echo "⚠️ WARNING: core.autocrlf is set to 'true'. Consider setting it to 'input' or 'false'."
          fi

          if [ "$eol_setting" = "crlf" ]; then
            echo "⚠️ WARNING: core.eol is set to 'crlf'. Consider unsetting it or setting it to 'lf'."
          fi

      - name: 🔍 Check migration files line endings (LF only)
        shell: bash
        run: |
          echo "🔍 Scanning migration SQL files for CR characters (\\r)..."

          if grep -Iq $'\r' packages/app-lib/migrations/*.sql; then
            echo "❌ ERROR: Some migration files contain CR characters; expected LF-only files."
            exit 1
          fi

          echo "✅ All migration files use LF line endings."

      - name: 🧰 Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust_targets }}

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🧰 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🧰 Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: 🦀 Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          cache-on-failure: true

      - name: 💨 Setup Turbo cache
        uses: rharkor/caching-for-turbo@v1.8

      - name: 🐧 Install Linux build dependencies
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: ⚙️ Set application environment
        shell: bash
        run: |
          cp packages/app-lib/.env.prod packages/app-lib/.env
          # Inject the private-repo update token from the Actions secret so the
          # shipped frontend can authenticate update checks and installer downloads.
          # Create a fine-grained PAT (Contents: Read, scoped to zoxenzz/LuminaLauncher
          # only) and store it as the LUMINA_UPDATE_TOKEN repository secret.
          if [ -n "${{ secrets.LUMINA_UPDATE_TOKEN }}" ]; then
            echo "GITHUB_TOKEN=${{ secrets.LUMINA_UPDATE_TOKEN }}" >> packages/app-lib/.env
          fi

      # Release tags look like release-1.2.3 or beta-1.2.3. Bake the numeric part
      # into the build so the shipped version matches the tag (otherwise the app
      # would keep re-offering the same release after updating).
      #
      # The version is sanitized to major.minor.patch (no leading 'v', no
      # pre-release suffix) because the MSI bundler requires numeric-only
      # versions — the exact failure this repo hit with "1.1.0-beta".
      - name: 🏷️ Derive app version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#release-}"
          VERSION="${VERSION#beta-}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION%%-*}"
          echo "Derived app version: ${VERSION}"
          node scripts/derive-version.mjs "${VERSION}"

      - name: 📦 Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 🧹 Clean previous bundles
        shell: bash
        run: |
          rm -rf target/release/bundle
          rm -rf target/*/release/bundle || true

      - name: 🔨 Build app
        shell: bash
        run: mise exec -- pnpm --filter @modrinth/app exec tauri build --target ${{ matrix.target }}

      - name: 📤 Upload app bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

      # Publish installers to the GitHub Release so the in-app auto-updater
      # (helpers/lumina/update.ts) can find them via the releases API.
      - name: 🚀 Publish bundles to GitHub Release
        if: needs.create-release.outputs.release_id != ''
        uses: softprops/action-gh-release@v2
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
