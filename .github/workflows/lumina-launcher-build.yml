name: Lumina Launcher App Build

on:
  push:
    branches:
      - main
      - master
      - prod
      - release
      - beta
      - feature*
    tags:
      - release-*
      - beta-*
    paths:
      - .github/workflows/lumina-launcher-build.yml
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/app-lib/**'
      - 'packages/app-macros/**'
      - 'packages/assets/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.jsonc'
      - 'mise.toml'
      - 'rust-toolchain.toml'
  workflow_dispatch:

concurrency:
  group: lumina-launcher-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: 🐧 Linux x86_64 Build
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            artifact_name: lumina-launcher-bundle-linux-x86_64
          - runner: windows-latest
            label: 🪟 Windows x86_64 Build
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact_name: lumina-launcher-bundle-windows-x86_64
          - runner: windows-latest
            label: 🪟 Windows aarch64 Build
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            artifact_name: lumina-launcher-bundle-windows-aarch64
          - runner: macos-latest
            label: 🍎 macOS x86_64 Build
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            artifact_name: lumina-launcher-bundle-macos-x86_64
          - runner: macos-latest
            label: 🍎 macOS aarch64 Build
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            artifact_name: lumina-launcher-bundle-macos-aarch64

    env:
      CI: true

    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Validate Git config does not introduce CRLF
        shell: bash
        run: |
          echo "🔍 Checking Git config for CRLF settings..."

          autocrlf=$(git config --get core.autocrlf || echo "unset")
          eol_setting=$(git config --get core.eol || echo "unset")

          echo "core.autocrlf = $autocrlf"
          echo "core.eol = $eol_setting"

          if [ "$autocrlf" = "true" ]; then
            echo "⚠️ WARNING: core.autocrlf is set to 'true'. Consider setting it to 'input' or 'false'."
          fi

          if [ "$eol_setting" = "crlf" ]; then
            echo "⚠️ WARNING: core.eol is set to 'crlf'. Consider unsetting it or setting it to 'lf'."
          fi

      - name: 🔍 Check migration files line endings (LF only)
        shell: bash
        run: |
          echo "🔍 Scanning migration SQL files for CR characters (\\r)..."

          if grep -Iq $'\r' packages/app-lib/migrations/*.sql; then
            echo "❌ ERROR: Some migration files contain CR characters; expected LF-only files."
            exit 1
          fi

          echo "✅ All migration files use LF line endings."

      - name: 🧰 Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust_targets }}

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🧰 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🧰 Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: 🦀 Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          cache-on-failure: true

      - name: 💨 Setup Turbo cache
        uses: rharkor/caching-for-turbo@v1.8

      - name: 🐧 Install Linux build dependencies
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: ⚙️ Set application environment
        shell: bash
        run: |
          cp packages/app-lib/.env.prod packages/app-lib/.env
          # Inject the Discord OAuth client secret from the Actions secret so it
          # never has to live in the repository. Store it as the
          # DISCORD_CLIENT_SECRET repository secret (Settings → Secrets and
          # variables → Actions) with the current value from your Discord app.
          if [ -n "${{ secrets.DISCORD_CLIENT_SECRET }}" ]; then
            echo "VITE_DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}" >> packages/app-lib/.env
          fi

      # Release tags look like release-1.2.3 or beta-1.2.3. Bake the numeric part
      # into the build so the shipped version matches the tag (otherwise the app
      # would keep re-offering the same release after updating).
      #
      # The version is sanitized to major.minor.patch (no leading 'v', no
      # pre-release suffix) because the MSI bundler requires numeric-only
      # versions — the exact failure this repo hit with "1.1.0-beta".
      - name: 🏷️ Derive app version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#release-}"
          VERSION="${VERSION#beta-}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION%%-*}"
          echo "Derived app version: ${VERSION}"
          node scripts/derive-version.mjs "${VERSION}"

      - name: 📦 Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 🧹 Clean previous bundles
        shell: bash
        run: |
          rm -rf target/release/bundle
          rm -rf target/*/release/bundle || true

      # Apple code signing + notarization is done natively by Tauri during
      # `tauri build` (tauri-bundler reads APPLE_CERTIFICATE /
      # APPLE_CERTIFICATE_PASSWORD for signing and APPLE_API_KEY /
      # APPLE_API_ISSUER / APPLE_API_KEY_PATH for notarization + stapling).
      # This step only exports those variables when the corresponding secrets
      # are configured, so CI keeps producing unsigned builds until they are
      # added (Settings → Secrets and variables → Actions).
      #
      # Secrets needed for a fully signed + notarized macOS build:
      #   - MACOS_CERTIFICATE:          base64 of the "Developer ID Application"
      #                                 certificate .p12
      #                                 (openssl base64 -in cert.p12 -out cert.b64)
      #   - MACOS_CERTIFICATE_PASSWORD: password of the .p12
      #   - APPLE_API_KEY:              base64 of the App Store Connect API key .p8
      #   - APPLE_API_KEY_ID:           API key ID (e.g. ABC123DEF4)
      #   - APPLE_API_ISSUER:           API key issuer ID
      - name: 🍎 Configure Apple code signing & notarization
        if: matrix.runner == 'macos-latest'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ]; then
            # Strip whitespace/newlines from the base64 (pasting output from
            # `certutil -encode` / `openssl base64` wraps at 64 chars) so the
            # single-line NAME=VALUE written to GITHUB_ENV stays well-formed.
            echo "APPLE_CERTIFICATE=${MACOS_CERTIFICATE//[[:space:]]/}" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$(printf '%s' "$MACOS_CERTIFICATE_PASSWORD" | tr -d '\r\n')" >> "$GITHUB_ENV"
            echo "✅ Apple code-signing credentials configured"
          else
            echo "::warning::MACOS_CERTIFICATE / MACOS_CERTIFICATE_PASSWORD secrets not configured — building unsigned."
          fi

          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            printf '%s' "${APPLE_API_KEY//[[:space:]]/}" | base64 -D > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"
            echo "✅ Apple notarization API key configured"
          else
            echo "::warning::APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER secrets not configured — skipping notarization."
          fi

      - name: 🔨 Build app
        shell: bash
        run: mise exec -- pnpm --filter @modrinth/app exec tauri build --target ${{ matrix.target }}

      # Sign the Windows installers (.exe / .msi) with signtool from the
      # Windows SDK. Skipped with a warning until the secrets are configured
      # (Settings → Secrets and variables → Actions).
      #
      #   - WINDOWS_CERTIFICATE:          base64 of the code-signing certificate .pfx
      #                                    (certutil -encode cert.pfx cert.b64, then
      #                                    paste the file contents as the secret)
      #   - WINDOWS_CERTIFICATE_PASSWORD:  password of the .pfx
      - name: 🪪 Sign Windows installers
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Host '::warning::WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD secrets not configured — skipping code signing.'
            exit 0
          }

          # Trim CR/LF only — the .pfx password could legitimately contain spaces.
          $certPassword = [regex]::Replace($env:WINDOWS_CERTIFICATE_PASSWORD, '[\r\n]', '')

          $certPath = Join-Path $env:RUNNER_TEMP 'codesign-cert.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Sort-Object { $_.FullName } -Descending | Select-Object -First 1
          if (-not $signtool) {
            throw 'signtool.exe was not found in the Windows SDK.'
          }

          $targets = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }

          foreach ($target in $targets) {
            Write-Host "Signing $($target.FullName)"
            & $signtool.FullName sign /fd sha256 /tr 'http://timestamp.digicert.com' /td sha256 /f $certPath /p $certPassword $target.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed for $($target.FullName)"
            }
          }

      - name: 📤 Upload app bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

      # Publish installers to the GitHub Release so the in-app auto-updater
      # (helpers/lumina/update.ts) can find them via the releases API.
      # Find-or-create the release and upload via gh CLI — robust, idempotent,
      # and not dependent on a separate release-creation job.
      - name: 🚀 Publish bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        # The repo is public, so updates are fetched anonymously — no PAT is
        # baked into the app. gh uses the auto-generated write token
        # (permissions: contents: write) to create/upload releases.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Create the release with curl + explicit JSON booleans. gh api sends
          # ALL -f/-F values as strings ("false"/"true") — verified against
          # gh 2.97 — which the Releases API rejects with 422. Concurrent matrix
          # jobs racing here just get a harmless 422 (already exists).
          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"${{ github.ref_name }}\",\"name\":\"${{ github.ref_name }}\",\"generate_release_notes\":true,\"draft\":false,\"prerelease\":false}" \
            "https://api.github.com/repos/${{ github.repository }}/releases" || true
          # Each platform only produces its own bundle types (Linux: deb/AppImage,
          # Windows: exe/msi, macOS: dmg). Unmatched globs would be passed to gh
          # as literal paths and fail the upload, so collect them with nullglob.
          shopt -s nullglob
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          FILES=("$BUNDLE_DIR"/nsis/*.exe "$BUNDLE_DIR"/msi/*.msi "$BUNDLE_DIR"/dmg/*.dmg "$BUNDLE_DIR"/deb/*.deb "$BUNDLE_DIR"/appimage/*.AppImage)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "⚠️ No installers found to upload — skipping."
            exit 0
          fi
          # Generate a .sha256 checksum file per installer so the in-app
          # updater can verify downloads (the frontend passes the matching
          # {asset}.sha256 asset URL to updater_download when it exists).
          SHA_FILES=()
          for f in "${FILES[@]}"; do
            if command -v sha256sum > /dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            elif command -v shasum > /dev/null 2>&1; then
              shasum -a 256 "$f" > "$f.sha256"
            else
              echo "⚠️ No sha256 tool available — skipping checksum for $f"
              continue
            fi
            SHA_FILES+=("$f.sha256")
          done
          gh release upload "${{ github.ref_name }}" "${FILES[@]}" "${SHA_FILES[@]}" --clobber
