<!--
  Branded NSIS installer header image (top-right corner of every page).
  After editing this SVG, regenerate apps/app/nsis/header.bmp (150x57, 24-bit BMP)
  by rasterizing it (e.g. headless Chrome screenshot) and converting to BMP.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="150" height="57" viewBox="0 0 150 57">
  <defs>
    <linearGradient id="headerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1813"/>
      <stop offset="1" stop-color="#100e0c"/>
    </linearGradient>
    <linearGradient id="headerGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe79a"/>
      <stop offset="0.5" stop-color="#fcc32b"/>
      <stop offset="1" stop-color="#e2a30c"/>
    </linearGradient>
    <linearGradient id="hmarkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241f15"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <linearGradient id="hmarkGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe79a"/>
      <stop offset="0.5" stop-color="#fcc32b"/>
      <stop offset="1" stop-color="#e2a30c"/>
    </linearGradient>
  </defs>

  <rect width="150" height="57" fill="url(#headerBg)"/>

